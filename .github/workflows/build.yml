name: Compiler l'APK

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Installer Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Tests unitaires (découpage et détection des taps)
        run: gradle testDebugUnitTest --stacktrace --no-daemon

      - name: Compiler l'APK
        run: gradle assembleDebug --stacktrace --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "dictee-en-boucle-${{ github.run_number }}.apk"

      - name: Envoyer l'APK (artefact)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Envoyer les rapports de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapports-tests
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Créer la Release avec l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Dictée en boucle — build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          body: |
            APK de « Dictée en boucle » (branche ${{ github.ref_name }}, commit ${{ github.sha }}).
            Sur le téléphone : touchez le fichier .apk ci-dessous pour le télécharger, puis ouvrez-le pour l'installer.
          files: dictee-en-boucle-${{ github.run_number }}.apk
          make_latest: "true"
